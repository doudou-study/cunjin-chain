<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B6CFF"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E2A50" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#1B2340">区块结构与 Merkle 树</text>
  <text x="40" y="72" font-size="13" fill="#7A839A">一笔交易改动会沿着「交易号 → Merkle 根 → 块哈希 → 下一块前哈希」一路向上击穿，无法局部遮掩</text>

  <!-- ================= 左：链式结构 ================= -->
  <text x="40" y="116" font-size="14.5" font-weight="700" fill="#4F46E5">一、链式结构</text>

  <!-- 区块 N-1 -->
  <g filter="url(#s1)">
    <rect x="40" y="136" width="290" height="180" rx="14" fill="#FFFFFF" stroke="#DDE1F0"/>
  </g>
  <rect x="40" y="136" width="290" height="38" rx="14" fill="#F1F3FC"/>
  <rect x="40" y="160" width="290" height="14" fill="#F1F3FC"/>
  <text x="60" y="161" font-size="13.5" font-weight="700" fill="#1B2340">区块 #196</text>
  <text x="270" y="161" font-size="11" fill="#8A93AB" text-anchor="end">已完成</text>
  <text x="60" y="200" font-size="11.5" fill="#6C7590">前块哈希</text>
  <text x="312" y="200" font-size="11.5" font-family="Consolas, monospace" fill="#4338CA" text-anchor="end">0000a7f3…c21e</text>
  <text x="60" y="224" font-size="11.5" fill="#6C7590">Merkle 根</text>
  <text x="312" y="224" font-size="11.5" font-family="Consolas, monospace" fill="#4338CA" text-anchor="end">0000b91d…4f80</text>
  <text x="60" y="248" font-size="11.5" fill="#6C7590">时间戳 / 难度</text>
  <text x="312" y="248" font-size="11.5" font-family="Consolas, monospace" fill="#6C7590" text-anchor="end">…  /  4</text>
  <text x="60" y="272" font-size="11.5" fill="#6C7590">nonce</text>
  <text x="312" y="272" font-size="11.5" font-family="Consolas, monospace" fill="#6C7590" text-anchor="end">183426</text>
  <text x="60" y="296" font-size="11.5" fill="#6C7590">块哈希</text>
  <text x="312" y="296" font-size="11.5" font-family="Consolas, monospace" fill="#0F9D6E" text-anchor="end">0000e2c4…9a17</text>

  <!-- 箭头 -->
  <line x1="334" y1="226" x2="406" y2="226" stroke="#9AA3C0" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="412,226 402,221 402,231" fill="#9AA3C0"/>
  <text x="373" y="216" font-size="10.5" fill="#8A93AB" text-anchor="middle">前哈希</text>

  <!-- 区块 N -->
  <g filter="url(#s1)">
    <rect x="422" y="136" width="290" height="180" rx="14" fill="#FFFFFF" stroke="#C9CFFA" stroke-width="1.6"/>
  </g>
  <rect x="422" y="136" width="290" height="38" rx="14" fill="url(#gB)"/>
  <rect x="422" y="160" width="290" height="14" fill="url(#gB)"/>
  <text x="442" y="161" font-size="13.5" font-weight="700" fill="#FFFFFF">区块 #197</text>
  <text x="692" y="161" font-size="11" fill="#E5E7FF" text-anchor="end">最新</text>
  <text x="442" y="200" font-size="11.5" fill="#6C7590">前块哈希</text>
  <text x="694" y="200" font-size="11.5" font-family="Consolas, monospace" fill="#4338CA" text-anchor="end">0000e2c4…9a17</text>
  <text x="442" y="224" font-size="11.5" fill="#6C7590">Merkle 根</text>
  <text x="694" y="224" font-size="11.5" font-family="Consolas, monospace" fill="#4338CA" text-anchor="end">0000f08b…31cd</text>
  <text x="442" y="248" font-size="11.5" fill="#6C7590">时间戳 / 难度</text>
  <text x="694" y="248" font-size="11.5" font-family="Consolas, monospace" fill="#6C7590" text-anchor="end">…  /  4</text>
  <text x="442" y="272" font-size="11.5" fill="#6C7590">nonce</text>
  <text x="694" y="272" font-size="11.5" font-family="Consolas, monospace" fill="#6C7590" text-anchor="end">2401857</text>
  <text x="442" y="296" font-size="11.5" fill="#6C7590">块哈希</text>
  <text x="694" y="296" font-size="11.5" font-family="Consolas, monospace" fill="#0F9D6E" text-anchor="end">0000a31e…7b52</text>

  <!-- 交易列表 -->
  <g filter="url(#s1)">
    <rect x="746" y="136" width="414" height="180" rx="14" fill="#FBFBFE" stroke="#E3E6F5"/>
  </g>
  <text x="768" y="162" font-size="13" font-weight="700" fill="#1B2340">区块 #197 打包的交易</text>
  <text x="768" y="186" font-size="11" font-family="Consolas, monospace" fill="#6C7590">CHECKIN    用户 0x8f21…  +12 分</text>
  <text x="768" y="206" font-size="11" font-family="Consolas, monospace" fill="#6C7590">TASK_DONE  用户 0x3bc7…  +1 分</text>
  <text x="768" y="226" font-size="11" font-family="Consolas, monospace" fill="#6C7590">TASK_DONE  用户 0x3bc7…  +1 分</text>
  <text x="768" y="246" font-size="11" font-family="Consolas, monospace" fill="#6C7590">DAY_CLEAR  用户 0x3bc7…  +10 分</text>
  <text x="768" y="266" font-size="11" font-family="Consolas, monospace" fill="#6C7590">REDEEM     用户 0x8f21…  -200 分</text>
  <text x="768" y="286" font-size="11" font-family="Consolas, monospace" fill="#6C7590">BADGE_MINT 用户 0x5a90…  -80 分</text>
  <text x="768" y="306" font-size="10.5" fill="#8A93AB">… 最多 25 笔一批，攒批出块而非一交易一块</text>

  <!-- 篡改提示 -->
  <rect x="40" y="336" width="1120" height="52" rx="12" fill="#FFF7ED" stroke="#FDE3C2"/>
  <text x="62" y="358" font-size="12.5" font-weight="700" fill="#B45309">篡改会被抓住的三种情形</text>
  <text x="62" y="377" font-size="11.5" fill="#8A6320">改交易金额 → 交易号变化 → Merkle 根对不上；只改块头 nonce 不重挖 → 难度不达标；老老实实把这一块重挖一遍 → 下一块的「前块哈希」对不上，从第 N+1 块开始整条断裂。</text>

  <!-- ================= 右：Merkle 树 ================= -->
  <text x="40" y="432" font-size="14.5" font-weight="700" fill="#4F46E5">二、Merkle 树与轻验证</text>
  <text x="40" y="454" font-size="11.5" fill="#7A839A">叶子节点是交易号；相邻两两哈希向上归并，奇数个时最后一个自复制，最终得到 Merkle 根写入块头。</text>

  <!-- 树 -->
  <!-- 根 -->
  <g filter="url(#s1)">
    <rect x="480" y="474" width="240" height="42" rx="10" fill="url(#gB)"/>
  </g>
  <text x="600" y="501" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Merkle 根  f08b…31cd</text>

  <!-- 第二层 -->
  <g filter="url(#s1)">
    <rect x="330" y="546" width="180" height="38" rx="9" fill="#FFFFFF" stroke="#C9CFFA"/>
    <rect x="690" y="546" width="180" height="38" rx="9" fill="#FFFFFF" stroke="#C9CFFA"/>
  </g>
  <text x="420" y="571" font-size="11.5" font-family="Consolas, monospace" fill="#4338CA" text-anchor="middle">H(a7f3 ‖ b91d)</text>
  <text x="780" y="571" font-size="11.5" font-family="Consolas, monospace" fill="#4338CA" text-anchor="middle">H(c21e ‖ d4f8)</text>

  <!-- 第三层 -->
  <g filter="url(#s1)">
    <rect x="180" y="614" width="150" height="36" rx="9" fill="#FFFFFF" stroke="#C9CFFA"/>
    <rect x="350" y="614" width="150" height="36" rx="9" fill="#FFFFFF" stroke="#C9CFFA"/>
    <rect x="540" y="614" width="150" height="36" rx="9" fill="#FFFFFF" stroke="#C9CFFA"/>
    <rect x="710" y="614" width="150" height="36" rx="9" fill="#FFFFFF" stroke="#C9CFFA"/>
  </g>
  <text x="255" y="637" font-size="11.5" font-family="Consolas, monospace" fill="#6C7590" text-anchor="middle">a7f3</text>
  <text x="425" y="637" font-size="11.5" font-family="Consolas, monospace" fill="#6C7590" text-anchor="middle">b91d</text>
  <text x="615" y="637" font-size="11.5" font-family="Consolas, monospace" fill="#6C7590" text-anchor="middle">c21e</text>
  <text x="785" y="637" font-size="11.5" font-family="Consolas, monospace" fill="#6C7590" text-anchor="middle">d4f8</text>

  <!-- 连线 -->
  <g stroke="#B9C0DA" stroke-width="1.4" fill="none">
    <path d="M600,516 L600,531 M420,531 L780,531 M420,531 L420,546 M780,531 L780,546"/>
    <path d="M420,584 L255,599 M420,584 L425,599 M780,584 L615,599 M780,584 L785,599"/>
    <path d="M420,584 L420,599"/>
  </g>

  <!-- 证明路径高亮 -->
  <rect x="540" y="610" width="150" height="44" rx="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="615" y="637" font-size="11.5" font-family="Consolas, monospace" fill="#92400E" text-anchor="middle">c21e</text>
  <path d="M690,584 L690,530 L600,530 L600,518" stroke="#F59E0B" stroke-width="2" fill="none"/>
  <path d="M330,584 L330,530 L600,530" stroke="#F59E0B" stroke-width="2" fill="none" stroke-dasharray="5 4"/>

  <!-- 右侧说明 -->
  <rect x="40" y="474" width="286" height="176" rx="12" fill="#F7F8FD" stroke="#E3E6F5"/>
  <text x="62" y="500" font-size="13" font-weight="700" fill="#1B2340">验真页怎么用这棵树</text>
  <text x="62" y="524" font-size="11.5" fill="#6C7590">服务端只返回被验交易到根的</text>
  <text x="62" y="542" font-size="11.5" fill="#6C7590">「兄弟节点路径」，浏览器拿到后</text>
  <text x="62" y="560" font-size="11.5" fill="#6C7590">用 WebCrypto 自己重算一遍。</text>
  <text x="62" y="588" font-size="11.5" fill="#B45309">本次要验的交易：c21e（黄色格）</text>
  <text x="62" y="608" font-size="11.5" fill="#6C7590">路径长度 = 2，只需 2 个兄弟哈希</text>
  <text x="62" y="626" font-size="11.5" fill="#6C7590">即能算出根，不必下载全块交易。</text>
  <text x="62" y="644" font-size="10.5" fill="#8A93AB">这就是轻节点能验真的原理。</text>

  <!-- 右侧：根比对 -->
  <rect x="910" y="474" width="250" height="176" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="932" y="500" font-size="13" font-weight="700" fill="#065F46">为什么这比签名更硬</text>
  <text x="932" y="524" font-size="11.5" fill="#116149">签名只证明「这笔交易是谁发的」，</text>
  <text x="932" y="544" font-size="11.5" fill="#116149">证明不了「它还在那条链里」。</text>
  <text x="932" y="572" font-size="11.5" fill="#116149">Merkle 证明把两件事绑一起：</text>
  <text x="932" y="592" font-size="11.5" fill="#116149">① 该交易确实被某个区块收录</text>
  <text x="932" y="612" font-size="11.5" fill="#116149">② 该区块头确实是我看到的那个</text>
  <text x="932" y="638" font-size="10.5" fill="#3F8F73">两者都靠哈希锁死，无法单方面伪造。</text>
</svg>
