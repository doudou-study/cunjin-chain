<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="gD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B6CFF"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="d1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E2A50" flood-opacity="0.10"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9AA3C0"/>
    </marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#1B2340">积分闭环：从行为到积分，再到四个出口</text>
  <text x="40" y="72" font-size="13" fill="#7A839A">积分不是数字装饰 —— 每一笔进出都写进流水表，同时在链上留一笔可被第三方验证的转账</text>

  <!-- ============ 左：行为侧（发放入口） ============ -->
  <rect x="40" y="100" width="300" height="480" rx="16" fill="#F7F8FD" stroke="#E3E6F5"/>
  <text x="64" y="130" font-size="14" font-weight="700" fill="#4F46E5">一、积分从哪来</text>

  <g filter="url(#d1)">
    <rect x="64" y="150" width="252" height="86" rx="12" fill="#FFFFFF" stroke="#DDE1F0"/>
    <rect x="64" y="252" width="252" height="86" rx="12" fill="#FFFFFF" stroke="#DDE1F0"/>
    <rect x="64" y="354" width="252" height="86" rx="12" fill="#FFFFFF" stroke="#DDE1F0"/>
    <rect x="64" y="456" width="252" height="86" rx="12" fill="#FFFFFF" stroke="#DDE1F0"/>
  </g>

  <text x="86" y="176" font-size="13.5" font-weight="700" fill="#1B2340">每日签到</text>
  <text x="86" y="198" font-size="11.5" fill="#6C7590">基础分 10 分，连续签到按阶梯加成</text>
  <text x="86" y="218" font-size="11.5" fill="#B45309">7 天 ×1.5　30 天 ×2.0　100 天 ×3.0</text>

  <text x="86" y="278" font-size="13.5" font-weight="700" fill="#1B2340">完成单个任务</text>
  <text x="86" y="300" font-size="11.5" fill="#6C7590">每个勾选完成的任务 +1 分</text>
  <text x="86" y="320" font-size="11.5" fill="#6C7590">撤销完成会同步扣回，流水留双记录</text>

  <text x="86" y="380" font-size="13.5" font-weight="700" fill="#1B2340">当天任务全清</text>
  <text x="86" y="402" font-size="11.5" fill="#6C7590">当日任务全部完成为止额外 +10 分</text>
  <text x="86" y="422" font-size="11.5" fill="#6C7590">每个自然日只触发一次，去重靠日期</text>

  <text x="86" y="482" font-size="13.5" font-weight="700" fill="#1B2340">连续里程碑</text>
  <text x="86" y="504" font-size="11.5" fill="#6C7590">达到 7 / 30 / 100 天时一次性发奖励分</text>
  <text x="86" y="524" font-size="11.5" fill="#6C7590">奖励金额来自数据库规则表，可运营配置</text>

  <!-- 箭头到中间 -->
  <line x1="344" y1="340" x2="404" y2="340" stroke="#9AA3C0" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- ============ 中：账户 ============ -->
  <g filter="url(#d1)">
    <rect x="412" y="234" width="196" height="212" rx="18" fill="url(#gD)"/>
  </g>
  <text x="510" y="272" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">积分账户</text>
  <text x="510" y="296" font-size="11" fill="#DDE1FF" text-anchor="middle">user_stats · point_accounts</text>
  <line x1="448" y1="312" x2="572" y2="312" stroke="#A9B2FF" stroke-width="1.4"/>
  <text x="510" y="340" font-size="11.5" fill="#FFFFFF" text-anchor="middle">可用余额 / 冻结积分</text>
  <text x="510" y="364" font-size="11.5" fill="#FFFFFF" text-anchor="middle">累计获得 / 累计消耗</text>
  <text x="510" y="388" font-size="11.5" fill="#FFFFFF" text-anchor="middle">等级与经验</text>
  <text x="510" y="416" font-size="11" fill="#C7CDFF" text-anchor="middle">每次变动都写 point_ledger</text>
  <text x="510" y="434" font-size="11" fill="#C7CDFF" text-anchor="middle">并产生一笔链上交易</text>

  <line x1="616" y1="340" x2="676" y2="340" stroke="#9AA3C0" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- ============ 右：四个出口 ============ -->
  <rect x="684" y="100" width="476" height="480" rx="16" fill="#F7F8FD" stroke="#E3E6F5"/>
  <text x="708" y="130" font-size="14" font-weight="700" fill="#4F46E5">二、积分往哪去</text>

  <g filter="url(#d1)">
    <rect x="708" y="150" width="428" height="86" rx="12" fill="#FFFFFF" stroke="#DDE1F0"/>
    <rect x="708" y="252" width="428" height="86" rx="12" fill="#FFFFFF" stroke="#DDE1F0"/>
    <rect x="708" y="354" width="428" height="86" rx="12" fill="#FFFFFF" stroke="#DDE1F0"/>
    <rect x="708" y="456" width="428" height="86" rx="12" fill="#FFFFFF" stroke="#DDE1F0"/>
  </g>
  <g>
    <rect x="708" y="150" width="5" height="86" rx="2.5" fill="#8B5CF6"/>
    <rect x="708" y="252" width="5" height="86" rx="2.5" fill="#F59E0B"/>
    <rect x="708" y="354" width="5" height="86" rx="2.5" fill="#0EA5E9"/>
    <rect x="708" y="456" width="5" height="86" rx="2.5" fill="#10B981"/>
  </g>

  <text x="734" y="176" font-size="13.5" font-weight="700" fill="#1B2340">① 兑换链上成就徽章</text>
  <text x="734" y="198" font-size="11.5" fill="#6C7590">消耗积分铸造一枚带序列号的凭证，凭证里带 Merkle 证明</text>
  <text x="734" y="218" font-size="11.5" fill="#6D28D9">可生成验真链接与二维码，供外部第三方独立核验</text>

  <text x="734" y="278" font-size="13.5" font-weight="700" fill="#1B2340">② 押注自己的目标</text>
  <text x="734" y="300" font-size="11.5" fill="#6C7590">积分先冻结，到期按真实完成度自动结算</text>
  <text x="734" y="320" font-size="11.5" fill="#B45309">达成按倍率从奖池双倍返还；未达成本金留在奖池</text>

  <text x="734" y="380" font-size="13.5" font-weight="700" fill="#1B2340">③ 积分商城兑换</text>
  <text x="734" y="402" font-size="11.5" fill="#6C7590">优惠券 / 课程名额 / 学习周边，扣分与扣库存同一事务</text>
  <text x="734" y="422" font-size="11.5" fill="#0C6E93">兑换记录上链，运营侧可看到每笔兑换的链上交易号</text>

  <text x="734" y="482" font-size="13.5" font-weight="700" fill="#1B2340">④ 公益捐赠</text>
  <text x="734" y="504" font-size="11.5" fill="#6C7590">把积分捐给平台公益项目，去向链上公示</text>
  <text x="734" y="524" font-size="11.5" fill="#0F7A5C">平台按 10% 配捐，配捐部分由铸币账户支出并留痕</text>

  <!-- 底部说明 -->
  <rect x="40" y="596" width="1120" height="32" rx="10" fill="#EEF0FF" stroke="#C9CFFA"/>
  <text x="600" y="617" font-size="12" fill="#4338CA" text-anchor="middle">设计要点：发放入口只有 4 个、消耗出口也只有 4 个，且每一笔都走「业务流水 + 链上转账」双写，出现差额时能立刻定位到具体哪一笔</text>
</svg>
